<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Arcadia Tactics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Lato', sans-serif;
        overflow: hidden;
        background-color: #242528;
        color: #e2e8f0;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Cinzel', serif;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b; 
      }
      ::-webkit-scrollbar-thumb {
        background: #475569; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b; 
      }

      /* Custom Screen-Space damage feedback animations */
      @keyframes vignette-flash-red {
        0% { opacity: 0; box-shadow: inset 0 0 80px rgba(220, 38, 38, 0.9); }
        15% { opacity: 1; box-shadow: inset 0 0 160px rgba(220, 38, 38, 1.0); }
        100% { opacity: 0; box-shadow: inset 0 0 100px rgba(220, 38, 38, 0); }
      }

      @keyframes vignette-flash-amber {
        0% { opacity: 0; box-shadow: inset 0 0 80px rgba(245, 158, 11, 0.9); }
        15% { opacity: 1; box-shadow: inset 0 0 200px rgba(245, 158, 11, 1.0), inset 0 0 50px rgba(239, 68, 68, 0.5); }
        100% { opacity: 0; box-shadow: inset 0 0 100px rgba(245, 158, 11, 0); }
      }

      @keyframes vignette-flash-green {
        0% { opacity: 0; box-shadow: inset 0 0 60px rgba(34, 197, 94, 0.85); }
        15% { opacity: 1; box-shadow: inset 0 0 130px rgba(34, 197, 94, 0.95); }
        100% { opacity: 0; box-shadow: inset 0 0 80px rgba(34, 197, 94, 0); }
      }

      @keyframes screen-shake {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        10% { transform: translate(-5px, -3px) rotate(-1deg); }
        20% { transform: translate(4px, 5px) rotate(1.5deg); }
        30% { transform: translate(-4px, -4px) rotate(0deg); }
        40% { transform: translate(5px, 3px) rotate(1deg); }
        50% { transform: translate(-3px, 4px) rotate(-1.5deg); }
        60% { transform: translate(4px, -2px) rotate(0deg); }
        70% { transform: translate(-5px, 3px) rotate(1deg); }
        80% { transform: translate(3px, -4px) rotate(-1deg); }
        90% { transform: translate(-2px, 5px) rotate(0deg); }
      }

      @keyframes float-up-fade {
        0% { opacity: 0; transform: translateY(10px) scale(0.5); }
        10% { opacity: 1; transform: translateY(0px) scale(1.1); }
        20% { transform: translateY(-5px) scale(1); }
        70% { opacity: 1; transform: translateY(-25px) scale(1); }
        100% { opacity: 0; transform: translateY(-40px) scale(0.9); }
      }

      .animate-float-up-fade {
        animation: float-up-fade 1.8s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
      }

      .animate-vignette-red {
        animation: vignette-flash-red 0.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
      }

      .animate-vignette-amber {
        animation: vignette-flash-amber 0.65s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
      }

      .animate-vignette-green {
        animation: vignette-flash-green 0.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
      }

      .animate-screen-shake {
        animation: screen-shake 0.32s cubic-bezier(.36,.07,.19,.97) both;
      }

      /* Chibi Grounded Idle Breathing Animation (Feet locked to the ground, scales upward) */
      @keyframes chibi-breathe-grounded {
        0%, 100% {
          transform: scale(1, 1);
        }
        50% {
          transform: scale(0.978, 1.042);
        }
      }

      .animate-chibi-breathe {
        transform-origin: 50% 100% !important;
        transform-box: fill-box !important;
        animation: chibi-breathe-grounded 2.4s ease-in-out infinite;
      }

      /* Ocultar etiquetas 3D (nombres y barras) de Drei HTML cuando hay algún modal o diálogo activo en pantalla */
      body:has(.fixed.inset-0.backdrop-blur-md, .fixed.inset-0.backdrop-blur, .absolute.inset-0.backdrop-blur-sm, .fixed.inset-0.bg-black\/75, .fixed.inset-0.bg-slate-950, #npc-gift-overlay) .rdrei-html-portal,
      body:has(.fixed.inset-0.backdrop-blur-md, .fixed.inset-0.backdrop-blur, .absolute.inset-0.backdrop-blur-sm, .fixed.inset-0.bg-black\/75, .fixed.inset-0.bg-slate-950, #npc-gift-overlay) [class*="rdrei-html"] {
        display: none !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚔️</text></svg>">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
